# Publishes the built site to GitHub Pages, so it has a URL a phone can open.
#
# Pages serves one live site per repository, which is why this runs from main
# alone. workflow_dispatch is there to re-publish the current main without a
# new commit; it is not a branch preview, and pointing it at a branch would
# put that branch's code on the live URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one half-way: an interrupted
# deploy leaves the live site on whichever files made it across.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # bengreynolds.github.io/website2 - a project site lives under /<repo>/,
      # and every asset path and route in the bundle is built against this.
      - run: npm run build
        env:
          VITE_BASE: /website2/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
