    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='5' fill='%23b83a0a'/%3E%3Ctext x='32' y='40' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='white'%3EBR%3C/text%3E%3C/svg%3E"
    />
    <title>Benjamin Reynolds | R&amp;D Engineer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Benjamin Reynolds",
        "jobTitle": "Research and Development Engineer",
        "worksFor": {
          "@type": "Organization",
          "name": "University of Colorado Anschutz Medical Campus"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Denver",
          "addressRegion": "CO"
        },
        "sameAs": [
          "https://www.linkedin.com/in/benjamin-reynolds",
          "https://github.com/bengreynolds"
        ]
      }
    </script>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
